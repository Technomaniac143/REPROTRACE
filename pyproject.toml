[project]
name = "reprotrace"
version = "0.1.0"
description = "Claim-level audit of machine-learning papers against code, data and run evidence."
requires-python = "==3.12.*"
dependencies = [
    "pydantic>=2",
]

[project.scripts]
reprotrace = "reprotrace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reprotrace"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
